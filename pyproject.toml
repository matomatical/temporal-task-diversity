[project]
name = "temporal-task-diversity"
version = "1.0.0"
description = "Code for Effiezal Aswadi et al., 2026, Temporal task diversity: Inductive bias under non-stationarity in synthetic sequence modelling"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "einops>=0.8.1",
    "jax==0.8.1",
    "jaxlib==0.8.1",
    "jaxtyping==0.3.3",
    "numpy>=2.3.5",
    "optax==0.2.6",
    "orbax-checkpoint==0.11.30",
    "tqdm>=4.67.1",
    "tyro>=0.9.35",
    "jax-tqdm>=0.1.3",
    "strux @ git+https://github.com/matomatical/strux.git@035cefd8e6e815c316e5a29517e7be9ef64e003c",
]

[dependency-groups]
tpu = [
  "jax[tpu]==0.8.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
# strux is pinned via a git URL (PEP 508 direct reference); hatchling
# rejects these by default for PyPI safety, but this project is not
# published to PyPI so we opt in.
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["iclr"]

[tool.ruff.lint]
# ignore F821 (undefined name) and F722 (syntax error in annotation) for jaxtyping dimension strings
ignore = ["F821", "F722"]
